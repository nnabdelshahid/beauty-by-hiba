<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings – Beauty by Hiba</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #231923;
      --muted: #6e6170;
      --rose: #b64272;
      --plum: #60325d;
      --gold: #e8b65f;
      --paper: #fff7fb;
      --line: rgba(35, 25, 35, 0.14);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(232, 182, 95, 0.28), transparent 18rem),
        linear-gradient(135deg, #fff1f7, #efe8fb);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 320px;
    }
    .page {
      width: min(100%, 820px);
      min-height: 100vh;
      display: grid;
      gap: 18px;
      margin: 0 auto;
      padding: 22px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, 0.6);
    }
    tr:last-child td {
      border-bottom: none;
    }
    .button {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      color: #fff;
      background: var(--rose);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>My Bookings</h1>
    <table id="bookingTable">
      <thead>
        <tr>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Deposit Paid</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="./script.js"></script>
</body>
</html>
