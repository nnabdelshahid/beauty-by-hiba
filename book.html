<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment – Beauty by Hiba</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #231923;
      --muted: #6e6170;
      --rose: #b64272;
      --plum: #60325d;
      --gold: #e8b65f;
      --paper: #fff7fb;
      --line: rgba(35, 25, 35, 0.14);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(232, 182, 95, 0.28), transparent 18rem),
        linear-gradient(135deg, #fff1f7, #efe8fb);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 320px;
    }
    .page {
      width: min(100%, 720px);
      min-height: 100vh;
      display: grid;
      gap: 18px;
      margin: 0 auto;
      padding: 22px;
    }
    h1 {
      margin-top: 0;
    }
    form {
      display: grid;
      gap: 12px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }
    label {
      display: grid;
      gap: 4px;
      font-weight: 600;
    }
    input,
    select {
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }
    .button {
      margin-top: 10px;
      padding: 10px 14px;
      color: #fff;
      background: var(--rose);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .success {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.88);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Book an Appointment</h1>
    <p>Fill out the form below to request a service. All bookings require a 50% deposit.</p>
    <form id="bookingForm">
      <label>
        Name
        <input type="text" name="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" required />
      </label>
      <label>
        Phone (optional)
        <input type="tel" name="phone" placeholder="e.g. 555-555-5555" />
      </label>
      <label>
        Service
        <select name="service">
          <option value="brows">Brows</option>
          <option value="makeup">Makeup</option>
          <option value="skin">Skin Prep</option>
          <option value="multi">Multi‑Day Event</option>
        </select>
      </label>
      <label>
        Date
        <input type="date" name="startDate" required />
      </label>
      <label>
        Time
        <input type="time" name="startTime" required />
      </label>
      <div id="endDateField" style="display:none">
        <label>
          End date
          <input type="date" name="endDate" />
        </label>
      </div>
      <button type="submit" class="button">Submit</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
